# Trading Desk settings. Every risk limit, session, contract and the trading mode live here.
# Change values in this file (or in a copy passed with --config); no code changes needed.

# backtest | paper | live
# paper is the default. live only works if you set it here yourself AND broker credentials exist.
mode: paper

account:
  starting_equity: 50000        # USD

risk:
  risk_per_trade_pct: 1.5       # max loss if the stop is hit, across ALL scale-in entries combined
  max_daily_loss_pct: 4.0       # stop opening trades for the rest of the day
  max_consecutive_losses: 3     # stop opening trades for the rest of the day
  max_weekly_drawdown_pct: 8.0  # pause trading and alert you
  max_total_drawdown_pct: 20.0  # circuit breaker: down this much from the account's peak = stop until you review (0 = off)
  max_open_positions: 3
  correlated_groups:            # contracts that move together share one risk budget
    - name: us_equity_index
      symbols: [MES, MNQ]
      max_combined_risk_pct: 2.0
  min_reward_risk: 3.0          # scanner only passes setups with at least 3:1 potential
  news_blackout_minutes: 10     # no new entries this long before and after high-impact news
  calendar_file: config/economic_calendar.csv   # scheduled releases for backtests; paper trading adds the live calendar
  weekly_resume: auto           # after the weekly limit: auto = resume next week (backtests), manual = wait for you (live)
  kill_switch: false            # true = no new trades at all
  shock_pause:                  # sudden-move guard (unscheduled news): pause new entries on that contract
    range_multiple: 6           # ... when one minute moves this many times its normal range (0 = off)
    minutes: 15                 # ... for this long

contracts: [MES, MNQ, MCL, MGC]

# Market Regime Agent: reads the market on completed 1-hour bars.
regime:
  timeframe: 1h
  adx_period: 14
  trend_adx: 25                 # ADX above this with price on one side of the EMA = trending
  range_adx: 20                 # ADX below this = ranging / choppy; in between = transition
  ema_period: 50
  vol_lookback_bars: 240        # ~2 weeks of 1-hour bars to judge whether volatility is high or low
  high_vol_pct: 0.80
  low_vol_pct: 0.20
  # Which setups may trade in which conditions.
  allowed:
    trend_breakout: [trending_up, trending_down, transition]
    pullback: [trending_up, trending_down]
    mean_reversion: [ranging]
    liquidity_sweep: [ranging, transition, trending_up, trending_down]
    squeeze_breakout: [ranging, transition, trending_up, trending_down]
  blocked_in_high_volatility: [mean_reversion, pullback]

# Market Scanner Agent: looks for setups on completed 15-minute bars.
scanner:
  timeframe: 15m
  min_score: 50                 # 0-100; candidates scoring lower are dropped
  setups:
    trend_breakout: {enabled: true, lookback: 20, volume_mult: 1.3, target_atr: 6.0}
    pullback: {enabled: true, fast_ema: 20, slow_ema: 50, swing_lookback: 10}
    mean_reversion: {enabled: true, band_period: 20, band_width: 2.0}
    liquidity_sweep: {enabled: true, lookback: 30, max_sweep_atr: 0.75}
    squeeze_breakout: {enabled: true, band_period: 20, squeeze_pct: 0.10, volume_mult: 1.5, target_atr: 6.0}

sessions:
  timezone: America/New_York
  # Trade any time a good setup appears. A liquidity check still applies (see execution.min_liquidity).
  # To limit trading to certain windows, list them here, e.g. [{name: london, start: "03:00", end: "05:00"}].
  entry_windows: all
  daily_break: {start: "17:00", end: "18:00"}   # CME maintenance break, no new orders

costs:
  commission_per_side: 0.85     # USD per contract per side, all-in (broker + exchange + NFA fees). Check your Tradovate plan.
  slippage_ticks:               # assumed slippage on market and stop orders, per side
    us_regular: 1
    london: 1
    overnight: 2

execution:
  scale_in:
    min_contracts_for_thirds: 3   # below this the trade is entered once, after confirmation
    starter_fraction: 0.3333
    confirm_timeframe: 1m
    confirm_timeout_bars: 10      # starter is closed if confirmation doesn't come within this many confirm bars
  exits:
    partial_at_r: 2.0             # take partial profit at 2R ...
    partial_fraction: 0.3333      # ... of this fraction of the position
    breakeven_at_r: 2.0           # and move the stop to breakeven
    trail:
      method: atr                 # atr | swing
      atr_period: 14
      atr_multiple: 3.0
  stops:
    atr_buffer: 0.25              # stops go beyond swing highs/lows plus this many ATRs
  max_reentries: 1                # one re-entry if stopped out and the setup is still valid
  min_liquidity:
    min_volume_1m: 20             # skip new entries when recent 1-minute volume is thinner than this
  max_contracts_per_order: 100    # safety cap: the Execution Agent refuses any single order bigger than this

data:
  provider: databento             # databento | synthetic (made-up data for tests and demos)
  dataset: GLBX.MDP3              # CME Globex
  store_path: data
  default_schema: ohlcv-1m        # 1-minute bars; trades (tick) is supported but much larger
  max_cost_usd_per_download: 5.0  # refuse a download that would cost more than this
  roll:
    method: volume                # switch to the next contract when its volume overtakes the current one
    confirm_days: 1               # ... for this many sessions in a row

logging:
  level: INFO
  path: logs

paper:
  data_provider: yahoo            # free prices, about 10 minutes behind (real-time via Tradovate later)
  state_path: paper-state         # where the paper account's prices, journal and status are kept
  warmup_days: 29                 # history loaded on the first run so indicators are ready immediately
  notify: trades                  # trades: post when trades open/close and on alerts | alerts: alerts only | none

# Broker (Phase 6). sim: trades are simulated only (paper trading). tradovate: every trade the desk makes is also
# mirrored at Tradovate, with real stop orders held at the broker. Start with environment: demo (practice money) and
# dry_run: true (it only writes down what it would send). Real money needs mode: live AND environment: live AND
# the live-readiness checklist passing; nothing can switch that on for you.
broker:
  name: sim
  environment: demo
  dry_run: true
  account: ""                     # Tradovate account name; blank = your first account
  entry_window_minutes: 20        # only copy an entry to the broker if the desk entered this recently
  max_entry_slip_r: 0.5           # ... and price hasn't run more than half the risk past the entry

# Head trader (Phase 4): Claude reviews every trade idea that passed the Scanner and the Risk Manager, with the
# chart, news, calendar and account in front of it. It can approve, make the trade smaller, or veto it. It can never
# make a trade bigger or loosen a stop, and the Risk Manager's limits still apply. Paper and live only: it is not
# used in backtests, because Claude already knows how past markets turned out.
# Needs the ANTHROPIC_API_KEY secret. Without it the desk trades on the rules alone.
reasoning:
  enabled: true
  model: claude-opus-5-5          # Anthropic's current default model; claude-sonnet-5-5 or claude-haiku-5-5 cost less
  effort: medium                  # how hard it thinks: low | medium | high | xhigh | max
  monthly_budget_usd: 20          # all Claude use together stops for the month at this amount
  max_reviews_per_day: 30
  when_unavailable: rules         # no key, over budget or an error: rules = trade on Scanner + Risk Manager, skip = no trade

# News & Sentiment Agent (Phase 4): live economic calendar, headlines and market mood.
news:
  calendar_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json   # free weekly calendar (Forex Factory)
  feeds:                          # free headline feeds (RSS)
    - https://www.federalreserve.gov/feeds/press_all.xml
    - https://feeds.content.dowjones.io/public/rss/mw_topstories
    - https://www.cnbc.com/id/100003114/device/rss/rss.html
    - https://www.cnbc.com/id/20910258/device/rss/rss.html
    - https://oilprice.com/rss/main
  sentiment_every_minutes: 60     # how often Claude reads new headlines
  model: claude-opus-5-5
  effort: low
  budget_share: 0.5               # news may use at most half of the monthly Claude budget
  max_pause_minutes: 60           # longest trading pause the News Agent may call for a breaking story

watchdog:
  max_data_delay_minutes: 40      # alert if the newest price is older than this while the market is open
  max_minutes_between_runs: 120   # warn if paper-trading updates are further apart than this while open
  gap_check_hours: 6              # look for holes in the recent data this far back
