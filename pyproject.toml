[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingdesk"
version = "0.1.0"
description = "Multi-agent, self-learning futures trading desk (paper trading by default)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "pandas>=2.2",
  "numpy>=1.26",
  "duckdb>=1.0",
  "pyarrow>=15",
  "pandas_market_calendars>=4.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
databento = ["databento>=0.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
desk = "tradingdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
