# The weekly learning review: Actions tab -> Learning review -> Run workflow (it also runs by itself every Saturday).
#
# It studies every closed trade (paper trading, plus a backtest on downloaded history if there is any), writes
# the review to learning/report.md, and shows it on the dashboard. Suggested setting changes that pass a test on
# held-back history go into a pull request: open it from the Pull requests tab, read the evidence, and press
# "Merge" to accept or "Close" to decline. Nothing changes until you merge.
name: Learning review
on:
  schedule:
    - cron: "17 14 * * 6"     # Saturdays 14:17 UTC, after the market's week is over
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency: learning
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}  # unlocks the encrypted market history, if downloaded
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Load the paper account
        uses: actions/cache/restore@v6
        with:
          path: paper-state
          key: paper-state-learning-${{ github.run_id }}
          restore-keys: paper-state-
      - name: Get market history (if downloaded)
        run: |
          if [ -n "$DATABENTO_API_KEY" ] && gh release download market-data -p data.tar.gz.enc 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:DATABENTO_API_KEY -in data.tar.gz.enc | tar -xz && echo "History found."
          else
            echo "No downloaded history; learning from paper trades only."
          fi
      - name: Review
        run: |
          desk learn --paper-state paper-state --out learning > learn.log 2>&1 || (cat learn.log; tail -5 learn.log | sed 's/^/::error title=Learning review failed::/'; exit 1)
          cat learning/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the review
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning
          git commit -m "Learning review $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
      - name: Open a pull request with the suggestions that passed
        run: |
          branch="learning/suggestions-$(date -u +%Y-%m-%d)"
          git switch -c "$branch"
          if desk learn-apply --report learning/latest.json --body pr-body.md; then
            git add config/default.yaml
            git commit -m "Learning Agent: suggested setting changes"
            git push -f origin "$branch"
            repo="${{ github.repository }}"
            if ! gh api "repos/$repo/pulls" -f title="Learning Agent suggestions $(date -u +%Y-%m-%d)" -f head="$branch" -f base=main \
                 -F body=@pr-body.md >/dev/null 2>&1; then
              echo "### Suggestions ready" >> "$GITHUB_STEP_SUMMARY"
              echo "GitHub didn't let this workflow open the pull request itself. Open it here: https://github.com/$repo/compare/main...$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
              echo "Then press Create pull request, read it, and Merge to accept." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No suggestions passed their test this week." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Post the review on the paper trading issue
        run: |
          repo="${{ github.repository }}"
          num=$(gh api "repos/$repo/issues?labels=paper-trading&state=open&per_page=1" --jq '.[0].number // empty')
          if [ -n "$num" ]; then gh api "repos/$repo/issues/$num/comments" -F body=@learning/report.md >/dev/null; fi
