# The "Check live data" button: Actions tab -> Check live data -> Run workflow.
# Fetches the last two days of free, delayed prices for each contract, and checks the economic calendar and news
# feeds, then shows what came back on the run's page.
name: Check live data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[live]"
      - run: desk live check --out check.md && cat check.md >> "$GITHUB_STEP_SUMMARY"
      - name: Show the result as notes on the run
        run: |
          echo "::notice title=Prices::$(grep -E '^\| M|^\*\*' check.md | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::notice title=Calendar and news::$(grep -E '^\| (Calendar|News)' check.md | sed ':a;N;$!ba;s/\n/%0A/g')"
