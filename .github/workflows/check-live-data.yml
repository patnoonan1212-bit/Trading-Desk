# The "Check live data" button: Actions tab -> Check live data -> Run workflow.
# Fetches the last two days of free, delayed prices for each contract and shows what came back on the run's page.
name: Check live data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: desk live check --out check.md && cat check.md >> "$GITHUB_STEP_SUMMARY"
      - name: Show the result as notes on the run
        run: grep -E '^\| M|^\*\*' check.md | head -10 | while IFS= read -r l; do echo "::notice title=Live data::$l"; done
